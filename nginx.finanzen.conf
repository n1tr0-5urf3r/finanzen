# Install as /etc/nginx/sites-available/finanzen.conf, adjust the domain and the
# certificate paths, then enable the site and reload nginx.
#
# The proxy header contract matters to the application:
#   * APP_PUBLIC_URL must be exactly this https URL. The session cookie's Secure
#     flag and the CSRF Origin check are both derived from it, so a mismatch
#     silently drops the flag and starts rejecting legitimate requests.
#   * X-Forwarded-Proto is what lets the backend recognise its own origin behind
#     TLS termination; it reads the first value only.

server {
    listen 80;
    listen [::]:80;
    server_name finanzen.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finanzen.example.org;

    ssl_certificate     /etc/letsencrypt/live/finanzen.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzen.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Spreadsheet and receipt uploads. Keep in step with APP_MAX_UPLOAD_BYTES,
    # which defaults to 25 MiB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        # Imports of a few thousand rows can take a while to come back.
        proxy_read_timeout    120s;
    }
}
