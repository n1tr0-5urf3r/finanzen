<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- The viewport line is EXACTLY coffee-tracker's, and that is the point.
         It is the one declaration that decides what `position: fixed` is measured
         against, and coffee-tracker has the same floating bottom navigation on the
         same phones without the drift this app kept reporting.

         No `viewport-fit=cover`: cover lays the page out edge to edge, behind the
         browser's own chrome, so `bottom` for a fixed element means the bottom of
         the DISPLAY rather than the bottom of what the page has been given.

         No `interactive-widget` either, and THAT is the part six previous attempts
         missed — the last of them removed `viewport-fit=cover` and recorded in
         this very comment that the two documents were now identical, while this
         key sat in the same tag, unexamined. It is not cosmetic. Gecko carries a
         separate code path for viewport handling while the dynamic toolbar is
         moving once `interactive-widget` is present; the default path keeps the
         initial containing block static through the whole toolbar animation
         (bug 1586144), which is precisely the property a bottom-anchored fixed
         element needs. Setting the key opts out of it, for a keyboard behaviour
         that is now handled where it belongs — in the one sheet that wanted it,
         see `--keyboard-inset` in quickadd.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14181b" />
    <link rel="icon" type="image/png" href="/fi.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installed to the home screen, the app runs with no browser chrome at all.
         That is not a nicety here: the URL bar hiding and revealing on scroll is
         what displaces a bottom navigation bar and swallows the first tap near it,
         and `standalone` removes the URL bar rather than compensating for it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <title>Finanzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
