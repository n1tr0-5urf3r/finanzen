<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately WITHOUT `viewport-fit=cover`. Cover lays the page out edge to
         edge, behind the browser's own chrome, so `bottom: 0` for a fixed element
         means the bottom of the DISPLAY rather than the bottom of what the page
         has been given — and every time Firefox's toolbar slides away, the
         compensation for that difference is the offset you see on the navigation
         bar. Without it the viewport is the visible content area, which is what
         the bar should be measured against. It is also the one structural
         difference between this document and coffee-tracker's, whose identical
         floating navigation does not drift. -->
    <!-- `interactive-widget=resizes-content` makes the soft keyboard SHRINK the
         viewport instead of overlapping it. Without it a bottom sheet — the
         category picker in Quick Add — keeps its full height when the keyboard
         opens, so the matches you are typing towards end up behind it and have to
         be scrolled for. With it, `dvh` and `bottom: 0` mean what they say while
         the keyboard is up. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#14181b" />
    <link rel="icon" type="image/png" href="/fi.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installed to the home screen, the app runs with no browser chrome at all.
         That is not a nicety here: the URL bar hiding and revealing on scroll is
         what displaces a bottom navigation bar and swallows the first tap near it,
         and `standalone` removes the URL bar rather than compensating for it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <title>Finanzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
