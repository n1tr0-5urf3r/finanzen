<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- No `viewport-fit=cover`. Cover lays the page out edge to edge, behind the
         browser's own chrome, so `bottom` for a fixed element would mean the
         bottom of the DISPLAY rather than the bottom of what the page has been
         given. It stays off.

         What must NOT be read into that: an earlier version of this comment
         reasoned "no cover, therefore `env(safe-area-inset-*)` is zero, therefore
         harmless". Measured on the phone, Firefox reports its dynamic toolbar's
         height — 48px — through `safe-area-inset-bottom` and tracks it as the
         toolbar slides. Every fixed offset built on env() moved by a whole
         toolbar. They are all gone now; see the note in layout.css.

         `interactive-widget=resizes-content` is also gone, but honesty about why:
         it was removed on a theory that the nav-lab measurement then DISPROVED —
         it was never the cause. It stays out because the keyboard behaviour it
         bought is now explicit in `useKeyboardInset`, not because it was guilty.
         Putting it back and deleting that hook is a reasonable follow-up. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14181b" />
    <link rel="icon" type="image/png" href="/fi.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installed to the home screen, the app runs with no browser chrome at all.
         That is not a nicety here: the URL bar hiding and revealing on scroll is
         what displaces a bottom navigation bar and swallows the first tap near it,
         and `standalone` removes the URL bar rather than compensating for it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <title>Finanzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
