<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14181b" />
    <link rel="icon" type="image/png" href="/fi.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installed to the home screen, the app runs with no browser chrome at all.
         That is not a nicety here: the URL bar hiding and revealing on scroll is
         what displaces a bottom navigation bar and swallows the first tap near it,
         and `standalone` removes the URL bar rather than compensating for it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <title>Finanzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
