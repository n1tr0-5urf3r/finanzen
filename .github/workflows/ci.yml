name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzen
          POSTGRES_PASSWORD: finanzen
          POSTGRES_DB: finanzen
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The integration tests create their own per-test database and a
      # NOSUPERUSER role, so they connect through this superuser only to do that.
      # Golden tests skip when the source workbooks are absent, which they always
      # are in CI — they carry personal financial data and are not committed.
      - run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgres://finanzen:finanzen@localhost:5432/finanzen
      # openapi.json is committed, so every contract change arrives as a reviewable
      # diff instead of as a surprise for whoever wrote the client. Two tests already
      # pin the document against a hardcoded (method, path) contract and against the
      # real router; this is the third gate, and the only one that catches a
      # regenerated document nobody committed.
      - name: OpenAPI document is up to date
        run: |
          cargo run --locked --bin openapi-export > openapi.json
          jq -e '.paths | length > 0' openapi.json > /dev/null
          git diff --exit-code -- openapi.json \
            || { echo "::error::openapi.json ist veraltet — 'cargo run --bin openapi-export > openapi.json' und mitcommitten"; exit 1; }

      - run: cargo build --release --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: finanzen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the container boots, reaches Postgres, runs its migrations, refuses
      # to run with an RLS-bypassing role, and serves the SPA fallback.
      - name: Smoke-test image
        run: |
          docker network create finanzen-smoke
          docker run --detach --name smoke-db --network finanzen-smoke \
            --env POSTGRES_DB=finanzen --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=smoke \
            --env APP_DB_USER=finanzen_app --env APP_DB_PASSWORD=smoke-app \
            --volume "$PWD/deploy/init-app-role.sh":/docker-entrypoint-initdb.d/10-app-role.sh:ro \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U postgres -q && break
            sleep 2
          done
          docker run --detach --name smoke-app --network finanzen-smoke \
            --env APP_SESSION_SECRET=ci-session-secret-that-is-long-enough \
            --env APP_PUBLIC_URL=http://127.0.0.1:3100 \
            --env DATABASE_URL=postgres://finanzen_app:smoke-app@smoke-db:5432/finanzen \
            --env KITCHENOWL_SYNC_ON_START=false \
            --publish 3100:3100 finanzen:ci
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/api/v1/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:3100/api/v1/health >/dev/null
              # setup-status proves the schema exists and is queryable
              curl --fail --silent http://127.0.0.1:3100/api/v1/auth/setup-status \
                | grep --quiet '"setupRequired":true'
              # the SPA fallback must answer an unknown client-side route
              curl --fail --silent http://127.0.0.1:3100/dashboard \
                | grep --quiet '<html'
              echo "smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "--- app logs ---"; docker logs smoke-app
          echo "--- db logs ---";  docker logs smoke-db
          exit 1

      - name: Remove smoke-test containers
        if: always()
        run: |
          docker rm --force smoke-app smoke-db || true
          docker network rm finanzen-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
