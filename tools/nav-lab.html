<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav-Labor</title>
<!-- The instrument that ended an eight-attempt bug.

     Four bottom bars in one document, each reporting how far its bottom edge
     travels against the visible screen while Firefox for Android collapses its
     toolbar. On the phone that had the problem it read: coffee-tracker's 0px,
     flush 0px, sticky 0px, this app's 48px — the exact height of the toolbar,
     which is what identified `env(safe-area-inset-bottom)` as the thing adding it.

     Not served: copy it into frontend/public/ to use it again, and take it out
     again afterwards. See the note in frontend/src/styles/layout.css. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #eef1f4; color: #14181b; }

  /* ── the readout, pinned to the TOP so measuring never involves the bottom ── */
  .hud {
    position: sticky; top: 0; z-index: 90;
    background: #14181b; color: #e8edf2;
    padding: .6rem .7rem; font: 12px/1.35 ui-monospace, Menlo, monospace;
  }
  .hud b { color: #7fd6ff; font-weight: 600; }
  .hud .spread { font-size: 20px; font-weight: 700; }
  .hud .ok { color: #6ee7a8; }
  .hud .bad { color: #ff8a8a; }
  .row { display: flex; flex-wrap: wrap; gap: .3rem; padding: .5rem .7rem; background: #fff; }
  .row button {
    font: inherit; padding: .5rem .7rem; border-radius: .5rem;
    border: 1px solid #c8d0d8; background: #fff; min-height: 44px;
  }
  .row button.on { background: #14181b; color: #fff; border-color: #14181b; }
  .filler p { padding: 0 .7rem; }
  .filler h2 { padding: 0 .7rem; margin: 1.4rem 0 .3rem; }

  /* ── variant A: coffee-tracker, as literally as possible ───────────────── */
  .shell-A { min-height: 100svh; padding-bottom: 6rem; }
  .bar-A {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    border-radius: 2rem; border: 2px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
    padding: .5rem; box-shadow: 0 18px 45px rgb(15 23 42 / 12%);
  }

  /* ── variant B: what finances ships today ──────────────────────────────── */
  .shell-B { display: flex; flex-direction: column; min-height: 100svh; }
  .shell-B .filler { flex: 1 1 auto; padding-bottom: calc(5.75rem + max(0px, env(safe-area-inset-bottom, 0px))); }
  .bar-B {
    position: fixed; z-index: 40;
    inset: auto .6rem calc(.6rem + max(0px, env(safe-area-inset-bottom, 0px))) .6rem;
    display: flex; justify-content: space-around;
    background: #14181b; color: #fff; border: 1px solid rgba(255,255,255,.08);
    border-radius: 1.25rem; padding: .3rem;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  /* ── variant C: flush to the edge, the known-bad baseline ──────────────── */
  .shell-C { min-height: 100svh; padding-bottom: 5rem; }
  .bar-C {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; justify-content: space-around;
    background: #14181b; color: #fff; padding: .4rem;
  }

  /* ── variant D: sticky instead of fixed ────────────────────────────────── */
  .shell-D { min-height: 100svh; display: flex; flex-direction: column; }
  .shell-D .filler { flex: 1 1 auto; }
  .bar-D {
    position: sticky; bottom: 12px; z-index: 40; margin: 0 12px 12px;
    display: flex; justify-content: space-around;
    background: #14181b; color: #fff; border-radius: 1.25rem; padding: .4rem;
  }

  .bar a {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 44px; font-size: .68rem; text-decoration: none;
    color: inherit; border-radius: 1rem; padding: .3rem;
  }
  .bar-A a { color: #2c303a; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: currentColor; opacity: .55; margin-bottom: 2px; }

  /* Only the active variant's bar is in the document at all. */
  .bar { display: none; }
  body[data-v="A"] .bar-A, body[data-v="B"] .bar-B,
  body[data-v="C"] .bar-C, body[data-v="D"] .bar-D { display: flex; }
  body[data-v="A"] .bar-A { display: grid; }
</style>
</head>
<body data-v="B">

<div class="hud">
  <div>Variante <b id="v">B</b> &nbsp; Taps: <b id="taps">0</b></div>
  <div>Ausschlag: <span class="spread" id="spread">–</span> px
       <span id="verdict"></span></div>
  <div>Abstand unten: <b id="gap">–</b> (min <b id="lo">–</b> / max <b id="hi">–</b>)</div>
  <div>innerHeight <b id="ih">–</b> · vv.height <b id="vh">–</b> · vv.offsetTop <b id="vo">–</b></div>
  <div>Dokument <b id="dh">–</b> · scrollY <b id="sy">–</b></div>
</div>

<div class="row">
  <button data-set="A">A coffee-tracker</button>
  <button data-set="B" class="on">B finances heute</button>
  <button data-set="C">C bündig</button>
  <button data-set="D">D sticky</button>
  <button id="reset">Messung zurücksetzen</button>
</div>

<div id="shell" class="shell-B">
  <div class="filler" id="filler"></div>

  <nav class="bar bar-A"><a><i class="dot"></i>Eins</a><a><i class="dot"></i>Zwei</a><a><i class="dot"></i>Drei</a><a><i class="dot"></i>Vier</a><a><i class="dot"></i>Fünf</a></nav>
  <nav class="bar bar-B"><a><i class="dot"></i>Eins</a><a><i class="dot"></i>Zwei</a><a><i class="dot"></i>Drei</a><a><i class="dot"></i>Vier</a><a><i class="dot"></i>Fünf</a></nav>
  <nav class="bar bar-C"><a><i class="dot"></i>Eins</a><a><i class="dot"></i>Zwei</a><a><i class="dot"></i>Drei</a><a><i class="dot"></i>Vier</a><a><i class="dot"></i>Fünf</a></nav>
  <nav class="bar bar-D"><a><i class="dot"></i>Eins</a><a><i class="dot"></i>Zwei</a><a><i class="dot"></i>Drei</a><a><i class="dot"></i>Vier</a><a><i class="dot"></i>Fünf</a></nav>
</div>

<script>
(function () {
  var body = document.body, shell = document.getElementById('shell');
  var lo = Infinity, hi = -Infinity, taps = 0;
  var $ = function (id) { return document.getElementById(id); };

  function activeBar() { return document.querySelector('body[data-v="' + body.dataset.v + '"] .bar-' + body.dataset.v); }

  function reset() { lo = Infinity; hi = -Infinity; taps = 0; $('taps').textContent = '0'; }

  function sample() {
    var bar = activeBar();
    if (bar) {
      var r = bar.getBoundingClientRect();
      // The whole experiment in one number: how far the bar's bottom edge sits
      // above the bottom of what the user can actually see. A bar that holds
      // still keeps this constant; the spread IS the jump, in pixels.
      var gap = Math.round(window.innerHeight - r.bottom);
      if (gap < lo) lo = gap;
      if (gap > hi) hi = gap;
      $('gap').textContent = gap;
      $('lo').textContent = lo === Infinity ? '–' : lo;
      $('hi').textContent = hi === -Infinity ? '–' : hi;
      var spread = (hi - lo);
      $('spread').textContent = isFinite(spread) ? spread : '–';
      var verdict = $('verdict');
      verdict.textContent = spread <= 2 ? 'ruhig' : 'SPRINGT';
      verdict.className = spread <= 2 ? 'ok' : 'bad';
    }
    $('ih').textContent = window.innerHeight;
    var vv = window.visualViewport;
    $('vh').textContent = vv ? Math.round(vv.height) : '–';
    $('vo').textContent = vv ? Math.round(vv.offsetTop) : '–';
    $('dh').textContent = document.documentElement.scrollHeight;
    $('sy').textContent = Math.round(window.scrollY);
    requestAnimationFrame(sample);
  }

  document.querySelectorAll('[data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-set]').forEach(function (o) { o.classList.remove('on'); });
      b.classList.add('on');
      body.dataset.v = b.dataset.set;
      shell.className = 'shell-' + b.dataset.set;
      $('v').textContent = b.dataset.set;
      reset();
    });
  });
  $('reset').addEventListener('click', reset);

  // Every tap that actually reaches the page is counted. If the first tap on a
  // bar does nothing and the second works, this counter is what proves it: the
  // swallowed tap never arrives here at all.
  document.querySelectorAll('.bar a').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      taps++; $('taps').textContent = taps;
      a.style.outline = '2px solid #6ee7a8';
      setTimeout(function () { a.style.outline = ''; }, 300);
    });
  });

  // Enough page to scroll for, so the toolbar has a reason to hide.
  var f = $('filler'), html = '';
  for (var i = 1; i <= 40; i++) {
    html += '<h2>Abschnitt ' + i + '</h2><p>Scrolle weit genug, dass Firefox seine Leiste einklappt, dann wieder zurück. Der Ausschlag oben zählt mit, um wie viele Pixel die Leiste dabei gewandert ist.</p>';
  }
  f.innerHTML = html;

  requestAnimationFrame(sample);
})();
</script>
</body>
</html>
